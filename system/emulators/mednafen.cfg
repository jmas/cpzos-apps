; CPZ Mednafen keymap, loaded with -ovconfig.
;
; The Cardputer Zero has no arrow keys on the base layer. Directions are WASD;
; the face buttons are J/K/L, the shoulders U/I, and Start/Select are
; Enter/Backspace. No Fn chord is required.

