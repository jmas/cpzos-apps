; CPZ Mednafen keymap, loaded with -ovconfig.
;
; The Cardputer Zero has no arrow keys on the base layer. Directions are
; F/X/Z/C, the face buttons J/K/L, the shoulders U/I, and Start/Select are
; Enter/Backspace. No Fn chord is required.

video.fs 1
video.frameskip 1
video.glvsync 0
; cage is pixman-only; avoid Mednafen's llvmpipe OpenGL blitter.
video.driver sdl

; The panel runs at 30 Hz, so 48 kHz output only adds resampling work. The
; SNES APU is native 32 kHz. 64 ms absorbs scheduler spikes without making
; the controls feel delayed.
sound.rate 32000
sound.buffer_time 64

; Mednafen's default device selection opens hw:0, which is the vc4 HDMI card
; on this board; the codec is card 1. Point it at the ES8389 by name so an
; HDMI monitor cannot steal the emulator's audio.
sound.device hw:CARD=ES8389Audio,DEV=0

; Esc exits the emulator. The default is F12, which is not on the base layer.
command.exit keyboard 0x0 41

nes.input.port1 gamepad
nes.input.port1.gamepad.up keyboard 0x0 9
nes.input.port1.gamepad.down keyboard 0x0 27
nes.input.port1.gamepad.left keyboard 0x0 29
nes.input.port1.gamepad.right keyboard 0x0 6
nes.input.port1.gamepad.a keyboard 0x0 14
nes.input.port1.gamepad.b keyboard 0x0 13
nes.input.port1.gamepad.start keyboard 0x0 40
nes.input.port1.gamepad.select keyboard 0x0 42

