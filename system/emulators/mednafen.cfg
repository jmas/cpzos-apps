; snes_faust is the newer SNES core. Its multi-threaded renderer moves the PPU
; to a second CPU, so the emulation thread is no longer pinned at ~100% and the
; audio thread gets scheduled on time.
snes_faust.renderer mt
snes_faust.affinity.ppu 1
snes_faust.videoip 0
snes_faust.correct_aspect 0
snes_faust.input.port1 gamepad
snes_faust.input.port1.gamepad.up keyboard 0x0 9
snes_faust.input.port1.gamepad.down keyboard 0x0 27
