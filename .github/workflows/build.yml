name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    # The packages include an aarch64 cpz-system-apps binary, so the job must
    # run on an ARM runner with an Arch Linux ARM container.  Using an x86_64
    # makepkg host would label that package x86_64.
    runs-on: ubuntu-24.04-arm
    container:
      image: menci/archlinuxarm:base-devel
    env:
      GPG_KEY_ID: ${{ secrets.CPZ_UI_KEY_ID }}
      GPG_PRIVATE_KEY: ${{ secrets.CPZ_UI_KEY }}
      GPG_PASSPHRASE: ${{ secrets.CPZ_UI_KEY_PASSPHRASE }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: pacman -Syu --noconfirm --disable-sandbox go git github-cli sudo gnupg
      - uses: actions/checkout@v4
      - name: builder user
        run: |
          useradd -m builder
          chown -R builder .
      - name: build packages and repository
        run: sudo -u builder ./tools/build-repo.sh
      - name: require the signing key
        run: |
          test -n "$GPG_KEY_ID" -a -n "$GPG_PRIVATE_KEY" -a -n "$GPG_PASSPHRASE" || {
            echo "CPZ_UI_KEY_ID, CPZ_UI_KEY and CPZ_UI_KEY_PASSPHRASE are required" >&2
            exit 1
          }
      - name: sign
        run: ./tools/sign-repo.sh
      - name: publish apps-stable
        env:
          # gh runs as root after the builder step; do not make it inspect the
          # git checkout, which is owned by the builder user.
          GH_REPO: ${{ github.repository }}
        run: |
          tag=apps-stable
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "CPZ apps (stable)" \
              --notes "Signed app repository. See cpz-arch for the trust root."
          gh release upload "$tag" dist/signed/* --clobber
